name: Auto Update YouTube Stats

permissions:
  contents: write

on:
  schedule:
    - cron: '30 * * * *'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 檢出儲存庫程式碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安裝依賴套件
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client

      - name: 執行 Python 腳本抓取數據
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python fetch_yt_stats.py

      - name: 自動提交並更新數據檔與網頁到 GitHub
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add data.json index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update YouTube statistics data [skip ci]" && git push)
