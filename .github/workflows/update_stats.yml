name: Auto Update YouTube Stats

on:
  schedule:
    # 每 30 分鐘自動執行一次 (Cron 格式)
    - cron: '*/30 * * * *'
  # 允許手動點擊按鈕觸發執行
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 檢出儲存庫程式碼
        uses: actions/checkout@v3

      - name: 設定 Python 環境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 安裝依賴套件
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client

      - name: 執行 Python 腳本抓取數據
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python fetch_yt_stats.py

      - name: 自動提交並更新 index.html 到 GitHub
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update video statistics [skip ci]" && git push)
